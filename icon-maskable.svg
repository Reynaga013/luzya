<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B794F6"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#341068"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0FBF95"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E0A42" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="150" cy="90" rx="260" ry="180" fill="url(#sheen)"/>

  <!-- encoge + recentra el glifo para que sobreviva a la máscara circular de Android -->
  <g transform="translate(305 259) scale(0.66) translate(-305 -259)">
    <g filter="url(#soft)">
      <path d="M 292 84
               L 178 296
               L 246 296
               L 210 434
               L 348 216
               L 274 216
               Z"
            fill="#ffffff"/>
    </g>
    <path d="M 372 372
             C 372 350 402 322 402 322
             C 402 322 432 350 432 372
             C 432 389.5 418.5 403 402 403
             C 385.5 403 372 389.5 372 372 Z"
          fill="url(#spark)"/>
    <path d="M 388 376 C 388 366 396 356 396 356" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
